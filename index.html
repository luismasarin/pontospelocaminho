<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movida – Protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#fa5000;
    --laranja-suave:#ffeee5;
    --cinza:#787878;
    --fundo:#f0f0f0;
    --pilula:#e4e4e4;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  button{font:inherit;border:none;background:none;cursor:pointer;color:inherit}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:linear-gradient(#5e5954 0%,#5e5954 45%,#dcdcdc 75%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;
    -webkit-font-smoothing:antialiased;letter-spacing:-.15px;
  }
  .tela{
    width:375px;max-width:100%;height:812px;background:var(--fundo);
    border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    box-shadow:0 30px 60px rgba(0,0,0,.18);
  }
  .status{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;height:44px;
    font-size:13px;font-weight:600;color:#111;flex-shrink:0}
  .status .ic{display:flex;gap:5px;align-items:center}

  .view{flex:1;overflow-y:auto;padding:14px 18px 100px;display:none}
  .view.ativa{display:block;animation:fade .25s ease}
  .view::-webkit-scrollbar{display:none}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .topo{display:flex;justify-content:center;padding-top:6px}
  .logo-img{height:30px;width:auto;display:block}
  .titulo-view{font-size:15px;font-weight:600;color:var(--laranja);text-align:center;margin-top:14px}

  .card{background:var(--card);border-radius:24px}
  .rota{margin-top:22px;padding:6px}
  .campo{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-radius:18px;transition:background .15s}
  .campo:active{background:#fafafa}
  .campo + .campo{border-top:1px solid #f1f1f1;border-radius:0 0 18px 18px}
  .campo .txt{flex:1}
  .campo label{display:block;font-size:11px;color:var(--cinza)}
  .campo span{display:block;font-size:14px;font-weight:500;color:var(--laranja);margin-top:2px}
  .pin{flex-shrink:0}
  .trocar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .3s}
  .trocar:active{background:var(--fundo)}
  .trocar.gira{transform:rotate(180deg)}

  .resumo{margin-top:6px;padding:16px 18px 18px}
  .resumo .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
  .resumo .valor{margin-top:22px;display:flex;align-items:baseline;gap:6px}
  .resumo .valor b{font-size:30px;font-weight:500;letter-spacing:-1.2px;color:var(--laranja);transition:transform .2s}
  .resumo .valor b.pulsa{transform:scale(1.08)}
  .resumo .valor em{font-style:normal;font-size:13px;color:var(--cinza)}
  .resumo .meta{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cinza)}
  .tag{background:var(--laranja-suave);color:var(--laranja);font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px}

  .acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .acao{background:var(--card);border-radius:20px;height:52px;display:flex;align-items:center;
    justify-content:space-between;padding:0 14px;font-size:12.5px;font-weight:500;color:var(--laranja);transition:transform .1s}
  .acao:active{transform:scale(.97)}
  .acao.on{background:var(--laranja);color:#fff}
  .acao.on svg{stroke:#fff;fill:#fff}

  .abas{display:flex;gap:4px;margin:24px -18px 12px;padding:0 18px;overflow-x:auto}
  .abas::-webkit-scrollbar{display:none}
  .aba{font-size:12px;padding:7px 13px;border-radius:999px;color:var(--cinza);white-space:nowrap;transition:all .15s}
  .aba.ativa{background:var(--laranja);color:#fff;font-weight:500}

  .titulo-lista{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--cinza);margin:0 2px 10px}
  .titulo-lista i{font-style:normal;background:var(--pilula);padding:1px 7px;border-radius:999px;font-size:11px}

  .lista{display:flex;flex-direction:column;gap:6px}
  .lugar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:var(--card);
    width:100%;text-align:left;transition:transform .1s,opacity .2s}
  .lugar:active{transform:scale(.98)}
  .lugar.fora{opacity:.5}
  .ico{width:34px;height:34px;border-radius:50%;background:var(--laranja-suave);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;position:relative}
  .ico .check{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:var(--laranja);
    border:2px solid #fff;display:flex;align-items:center;justify-content:center}
  .lugar.fora .check{display:none}
  .info{flex:1;min-width:0}
  .info strong{display:block;font-size:13px;font-weight:500;color:var(--laranja);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info small{display:block;font-size:11.5px;color:var(--cinza);margin-top:3px}
  .dist{text-align:right;flex-shrink:0}
  .dist b{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:13px;font-weight:500;color:var(--laranja)}
  .pts{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:999px;background:var(--laranja-suave);
    color:var(--laranja);font-weight:500;font-size:10.5px}
  .vazio{text-align:center;font-size:12px;color:var(--cinza);padding:30px 0}

  /* nav */
  .nav{position:absolute;left:0;right:0;bottom:0;height:84px;padding-bottom:18px;z-index:10;
    background:linear-gradient(rgba(240,240,240,0),var(--fundo) 40%);
    display:flex;justify-content:center;align-items:center;gap:52px}
  .nav button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#a5a5a5}
  .nav button.ativa{color:var(--laranja)}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:#111;z-index:40}

  /* sheet */
  .veu{position:absolute;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .veu.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:34px;padding:10px 20px 26px;
    transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:30;max-height:75%;overflow-y:auto}
  .sheet.on{transform:none}
  .alca{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 16px}
  .sheet h3{font-size:15px;font-weight:600;color:var(--laranja)}
  .sheet p{font-size:12.5px;color:var(--cinza);line-height:1.5;margin-top:6px}
  .opcao{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid #f2f2f2;text-align:left}
  .opcao:last-child{border-bottom:none}
  .opcao .txt{flex:1}
  .opcao strong{display:block;font-size:13.5px;font-weight:500;color:var(--laranja)}
  .opcao small{display:block;font-size:11.5px;color:var(--cinza);margin-top:2px}
  .opcao .sel{width:18px;height:18px;border-radius:50%;border:1.5px solid #ddd}
  .opcao.on .sel{border:5px solid var(--laranja)}
  .det-topo{display:flex;align-items:center;gap:12px}
  .det-topo .ico{width:46px;height:46px}
  .det-dados{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
  .det-dados div{background:var(--fundo);border-radius:16px;padding:10px 12px}
  .det-dados small{display:block;font-size:10.5px;color:var(--cinza)}
  .det-dados b{display:block;font-size:13px;font-weight:500;color:var(--laranja);margin-top:3px}
  .btn{width:100%;height:50px;border-radius:999px;background:var(--laranja);color:#fff;font-size:13.5px;font-weight:500;margin-top:16px;transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--fundo);color:var(--laranja)}

  /* tela cheia: viagem / mapa */
  .full{position:absolute;inset:0;background:var(--fundo);z-index:25;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .full.on{transform:none}
  .full-topo{display:flex;align-items:center;justify-content:space-between;padding:56px 18px 8px}
  .circ{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
  .full-topo span{font-size:13.5px;font-weight:600;color:var(--laranja)}
  .full-corpo{flex:1;overflow-y:auto;padding:10px 18px 30px}
  .mapa{background:#fff;border-radius:28px;height:360px;position:relative;overflow:hidden}
  .mapa svg{position:absolute;inset:0;width:100%;height:100%}
  .progresso{height:6px;border-radius:3px;background:var(--pilula);overflow:hidden;margin-top:14px}
  .progresso i{display:block;height:100%;background:var(--laranja);border-radius:3px;transition:width .6s ease}
  .prox{margin-top:6px;padding:16px 18px}
  .prox .l{font-size:11.5px;color:var(--cinza)}
  .prox h4{font-size:17px;font-weight:500;color:var(--laranja);margin-top:8px;letter-spacing:-.4px}
  .prox .meta{font-size:12px;color:var(--cinza);margin-top:4px}
  .ganho{margin-top:6px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--cinza)}
  .ganho b{font-size:20px;font-weight:500;color:var(--laranja);letter-spacing:-.6px}
  .fim{text-align:center;padding:40px 10px 10px}
  .fim .big{width:72px;height:72px;border-radius:50%;background:var(--laranja);margin:0 auto;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(250,80,0,.3)}
  .fim h4{font-size:20px;font-weight:500;color:var(--laranja);margin-top:20px;letter-spacing:-.5px}
  .fim p{font-size:12.5px;color:var(--cinza);margin-top:6px}

  /* carro / perfil */
  .bloco{margin-top:22px;padding:18px}
  .bloco .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--cinza)}
  .bloco h4{font-size:18px;font-weight:500;color:var(--laranja);margin-top:14px;letter-spacing:-.4px}
  .linhas{margin-top:6px;padding:4px 18px}
  .linha{display:flex;justify-content:space-between;padding:13px 0;font-size:12.5px;border-bottom:1px solid #f2f2f2}
  .linha:last-child{border-bottom:none}
  .linha span{color:var(--cinza)}
  .linha b{font-weight:500;color:var(--laranja)}
  .carro-ilu{display:flex;justify-content:center;margin:18px 0 6px}
  .saldo{font-size:34px;font-weight:500;color:var(--laranja);letter-spacing:-1.4px;margin-top:20px}
  .nivel{height:6px;border-radius:3px;background:var(--pilula);margin-top:16px;overflow:hidden}
  .nivel i{display:block;height:100%;background:var(--laranja)}

  .toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-20px);background:#111;color:#fff;font-size:12px;
    padding:10px 16px;border-radius:999px;opacity:0;transition:all .25s;z-index:50;white-space:nowrap;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    <div class="full-corpo" id="viagem-corpo"></div>
  </div>

  <!-- MAPA -->
  <div class="full" id="f-mapa">
    <div class="full-topo">
      <button class="circ" onclick="abrirFull('f-mapa',false)" aria-label="Voltar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fa5000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span>Mapa da rota</span>
      <span style="width:36px"></span>
    </div>
    <div class="full-corpo">
      <div class="mapa" id="mapa"></div>
      <div class="lista" id="mapa-lista" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="veu" id="veu"></div>
  <div class="sheet" id="sheet"><div class="alca"></div><div id="sheet-corpo"></div></div>
  <div class="toast" id="toast"></div>

  <nav class="nav">
    <button class="ativa" data-v="v-inicio" aria-label="Início"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="currentColor"/><rect x="9" y="15" width="6" height="2" rx="1" fill="#fff"/></svg></button>
    <button data-v="v-carro" aria-label="Meu carro"><svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 6.6 4.2A2 2 0 0 1 8.5 3h7a2 2 0 0 1 1.9 1.2L19 9"/><rect x="3" y="9" width="18" height="7" rx="2.5"/><path d="M5 16v2.5M19 16v2.5M3 9H1.5M21 9h1.5"/><circle cx="7" cy="12.5" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="12.5" r="1" fill="currentColor" stroke="none"/><path d="M10 13h4"/></svg></button>
    <button data-v="v-perfil" aria-label="Pontos"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2.5 20.5 7.3v9.4L12 21.5 3.5 16.7V7.3z" fill="currentColor"/><circle cx="12" cy="12" r="3" fill="#f0f0f0"/></svg></button>
  </nav>
  <div class="home-ind"></div>
</div>

<script>
const ICONES = {
  cachoeira:'<path d="M8 3v10M12 3v14M16 3v10"/><path d="M4 20c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 4-1.5"/>',
  restaurante:'<path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/>',
  vale:'<path d="m2 20 7-11 4 6 3-4 6 9z"/>',
  mirante:'<circle cx="12" cy="14" r="4"/><path d="M12 4v2M4.9 7l1.4 1.4M19.1 7l-1.4 1.4M2 20h20"/>',
  cafe:'<path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/>'
};
const ROTULO = {cachoeira:'Cachoeira',restaurante:'Restaurante',vale:'Vale',mirante:'Mirante',cafe:'Café'};
const FILTROS = [['todos','Todos'],['cachoeira','Cachoeiras'],['vale','Vales'],['restaurante','Restaurantes'],['mirante','Mirantes'],['cafe','Cafés']];

const ORIGENS = ['São Paulo, SP','Campinas, SP','São José dos Campos, SP'];
const DESTINOS = {
  'Campos do Jordão, SP':{via:'via Carvalho Pinto',km:182,tempo:'2h 40min',paradas:[
    {n:'Cachoeira do Vale Encantado',c:'cachoeira',d:'trilha de 15 min',km:48,p:150,t:'Poço de água cristalina a poucos minutos do acostamento, com área para banho e sombra.'},
    {n:'Rancho da Serra',c:'restaurante',d:'fogão a lenha',km:87,p:220,t:'Comida caipira servida no fogão a lenha, com vista para o vale e mesas ao ar livre.'},
    {n:'Vale das Araucárias',c:'vale',d:'piquenique',km:124,p:180,t:'Gramado amplo entre araucárias centenárias, ótimo para uma pausa com a família.'},
    {n:'Mirante Pedra do Céu',c:'mirante',d:'pôr do sol',km:152,p:270,t:'Um dos pontos mais altos da serra, com vista de 360° e pôr do sol imperdível.'},
    {n:'Café da Estrada Velha',c:'cafe',d:'queijos artesanais',km:163,p:120,t:'Café colonial com queijos e doces produzidos na própria fazenda.'}]},
  'Ubatuba, SP':{via:'via Tamoios',km:232,tempo:'3h 20min',paradas:[
    {n:'Cachoeira do Poço Azul',c:'cachoeira',d:'acesso fácil',km:96,p:200,t:'Queda d\'água com piscina natural de tom azulado, a 5 minutos da rodovia.'},
    {n:'Vale do Rio Claro',c:'vale',d:'trilha leve',km:141,p:160,t:'Trilha plana ao longo do rio, com pontos para descanso e observação de aves.'},
    {n:'Mirante da Serra do Mar',c:'mirante',d:'vista do litoral',km:188,p:290,t:'Vista panorâmica da descida da serra até o mar. Melhor pela manhã.'},
    {n:'Quiosque Caiçara',c:'restaurante',d:'peixe frito',km:214,p:130,t:'Peixe fresco e pastel de camarão servidos à beira da estrada.'}]},
  'Monte Verde, MG':{via:'via Fernão Dias',km:168,tempo:'2h 50min',paradas:[
    {n:'Empório da Mantiqueira',c:'cafe',d:'doces e café',km:72,p:110,t:'Parada clássica com café coado, pão de queijo e doces caseiros.'},
    {n:'Cachoeira das Andorinhas',c:'cachoeira',d:'trilha de 20 min',km:118,p:240,t:'Cachoeira cercada de mata, com trilha sinalizada e mirante no topo.'},
    {n:'Vale dos Pinheiros',c:'vale',d:'clima de montanha',km:146,p:190,t:'Estrada cênica entre pinheiros, com espaço para fotos e piquenique.'},
    {n:'Mirante do Chapéu',c:'mirante',d:'acima das nuvens',km:160,p:300,t:'Em dias frios, o mirante fica acima das nuvens. Vale madrugar.'}]}
};

const estado = {
  origem:ORIGENS[0], destino:'Campos do Jordão, SP', invertido:false, filtro:'todos',
  fora:new Set(), salvas:new Set(), saldo:1240,
  historico:[{n:'São Paulo → Holambra',d:'12 out',p:410},{n:'São Paulo → Santos',d:'28 set',p:260},{n:'Campinas → Socorro',d:'02 set',p:570}]
};
const $ = id => document.getElementById(id);
const pinSvg = '<svg width="9" height="11" viewBox="0 0 24 28"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 16 12 16s12-7 12-16C24 5.4 18.6 0 12 0z" fill="#fa5000"/><circle cx="12" cy="12" r="4.5" fill="#fff"/></svg>';
const icone = (c,s=15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fa5000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONES[c]}</svg>`;
const fmt = n => n.toLocaleString('pt-BR');

function rota(){ return DESTINOS[estado.destino]; }
function paradas(){
  const r = rota();
  let ps = r.paradas.map((p,i)=>({...p,id:estado.destino+'|'+i}));
  if(estado.invertido) ps = ps.map(p=>({...p,km:r.km-p.km})).reverse();
  return ps;
}
function chaveRota(){ return estado.origem+'→'+estado.destino; }
function pontosRota(){ return paradas().filter(p=>!estado.fora.has(p.id)).reduce((s,p)=>s+p.p,0); }

function render(){
  const r = rota();
  $('txt-origem').textContent = estado.invertido ? estado.destino : estado.origem;
  $('txt-destino').textContent = estado.invertido ? estado.origem : estado.destino;
  $('txt-via').textContent = r.via;
  const ps = paradas(), ativas = ps.filter(p=>!estado.fora.has(p.id));
  const b = $('txt-pontos'); const novo = fmt(pontosRota());
  if(b.textContent!==novo){ b.textContent=novo; b.classList.add('pulsa'); setTimeout(()=>b.classList.remove('pulsa'),200); }
  $('txt-paradas').textContent = `${ativas.length} de ${ps.length} paradas na rota`;
  $('txt-km').textContent = `${r.km} km · ${r.tempo}`;
  const salva = estado.salvas.has(chaveRota());
  $('btn-salvar').classList.toggle('on',salva); $('txt-salvar').textContent = salva?'Salva':'Salvar';

  $('abas').innerHTML = FILTROS.map(([k,t])=>`<button class="aba ${estado.filtro===k?'ativa':''}" data-f="${k}">${t}</button>`).join('');
  const vis = ps.filter(p=>estado.filtro==='todos'||p.c===estado.filtro);
  $('txt-qtd').textContent = '+'+vis.length;
  $('lista').innerHTML = vis.length ? vis.map(itemHTML).join('') : '<div class="vazio">Nenhuma parada desse tipo nesta rota.</div>';
}
function itemHTML(p){
  return `<button class="lugar ${estado.fora.has(p.id)?'fora':''}" data-id="${p.id}">
    <div class="ico">${icone(p.c)}<span class="check"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span></div>
    <div class="info"><strong>${p.n}</strong><small>${ROTULO[p.c]} · ${p.d}</small></div>
    <div class="dist"><b>${pinSvg}${p.km} km</b><span class="pts">+${p.p} pts</span></div>
  </button>`;
}

/* sheet */
function abrirSheet(html){ $('sheet-corpo').innerHTML=html; $('veu').classList.add('on'); $('sheet').classList.add('on'); }
function fecharSheet(){ $('veu').classList.remove('on'); $('sheet').classList.remove('on'); }
$('veu').onclick = fecharSheet;

function escolher(tipo){
  const lista = tipo==='origem' ? ORIGENS : Object.keys(DESTINOS);
  const atual = estado[tipo];
  abrirSheet(`<h3>${tipo==='origem'?'Ponto de partida':'Para onde você vai?'}</h3>
    <div style="margin-top:8px">${lista.map(x=>{
      const sub = tipo==='destino' ? `${DESTINOS[x].km} km · ${DESTINOS[x].paradas.length} paradas` : 'Usar como saída';
      return `<button class="opcao ${x===atual?'on':''}" data-esc="${tipo}" data-val="${x}"><div class="txt"><strong>${x}</strong><small>${sub}</small></div><span class="sel"></span></button>`;
    }).join('')}</div>`);
}
function detalhe(id){
  const p = paradas().find(x=>x.id===id); const fora = estado.fora.has(id);
  abrirSheet(`<div class="det-topo"><div class="ico">${icone(p.c,20)}</div><div><h3>${p.n}</h3><p style="margin:2px 0 0">${ROTULO[p.c]} · ${p.d}</p></div></div>
    <p style="margin-top:14px">${p.t}</p>
    <div class="det-dados"><div><small>Distância</small><b>${p.km} km</b></div><div><small>Desvio</small><b>+${5+(p.p%9)} min</b></div><div><small>Pontos</small><b>+${p.p}</b></div></div>
    <button class="btn ${fora?'':'sec'}" data-toggle="${id}">${fora?'Adicionar à rota':'Remover da rota'}</button>`);
}

document.addEventListener('click',e=>{
  const t = e.target.closest('button,[role=button]'); if(!t) return;
  if(t.id==='btn-trocar'){ e.stopPropagation(); estado.invertido=!estado.invertido; t.classList.toggle('gira'); render(); return; }
  if(t.id==='btn-origem') return escolher(estado.invertido?'destino':'origem');
  if(t.id==='btn-destino') return escolher(estado.invertido?'origem':'destino');
  if(t.dataset.esc){ estado[t.dataset.esc]=t.dataset.val; estado.filtro='todos'; fecharSheet(); render(); return; }
  if(t.dataset.f){ estado.filtro=t.dataset.f; render(); return; }
  if(t.dataset.id) return detalhe(t.dataset.id);
  if(t.dataset.toggle){
    const id=t.dataset.toggle, p=paradas().find(x=>x.id===id);
    if(estado.fora.has(id)){ estado.fora.delete(id); toast(`${p.n} adicionada · +${p.p} pts`); }
    else { estado.fora.add(id); toast('Parada removida da rota'); }
    fecharSheet(); render(); return;
  }
  if(t.id==='btn-salvar'){
    const k=chaveRota();
    if(estado.salvas.has(k)){ estado.salvas.delete(k); toast('Rota removida das salvas'); } else { estado.salvas.add(k); toast('Rota salva'); }
    render(); return;
  }
  if(t.id==='btn-mapa'){ desenharMapa(); abrirFull('f-mapa',true); return; }
  if(t.id==='btn-iniciar'){ iniciarViagem(); return; }
  if(t.dataset.v){ trocarView(t.dataset.v); return; }
});

function trocarView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('ativa',x.id===v));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('ativa',x.dataset.v===v));
  if(v==='v-perfil') renderPerfil();
}
function abrirFull(id,on){ $(id).classList.toggle('on',on); }

/* mapa */
function desenharMapa(){
  const r=rota(), ps=paradas().filter(p=>!estado.fora.has(p.id));
  const pts=[[60,320]]; const W=300;
  ps.forEach((p,i)=>{ const f=p.km/r.km; pts.push([60+f*200+(i%2?28:-28), 320-f*260]); });
  pts.push([260,50]);
  const d='M'+pts.map(q=>q.join(' ')).join(' L');
  $('mapa').innerHTML=`<svg viewBox="0 0 320 360">
    <defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3f3f3"/></pattern></defs>
    <rect width="320" height="360" fill="url(#g)"/>
    <path d="${d}" fill="none" stroke="#ffeee5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#fa5000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/>
    ${pts.slice(1,-1).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="#fff" stroke="#fa5000" stroke-width="2.5"/>`).join('')}
    <g transform="translate(${pts[0][0]-8} ${pts[0][1]-22})"><path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" fill="#fa5000"/><circle cx="8" cy="8" r="3" fill="#fff"/></g>
    <g transform="translate(${pts.at(-1)[0]-8} ${pts.at(-1)[1]-22})"><path d="M8 1.5C4.4 1.5 1.5 4.4 1.5 8c0 5 6.5 10 6.5 10s6.5-5 6.5-10c0-3.6-2.9-6.5-6.5-6.5z" fill="#fff" stroke="#fa5000" stroke-width="2"/><circle cx="8" cy="8" r="2.3" fill="none" stroke="#fa5000" stroke-width="2"/></g>
  </svg>`;
  $('mapa-lista').innerHTML = ps.map(itemHTML).join('');
}

/* viagem */
let viagem=null;
function iniciarViagem(){
  const ps=paradas().filter(p=>!estado.fora.has(p.id));
  viagem={ps,i:0,ganho:0,feitas:[]};
  $('viagem-titulo').textContent='A caminho de '+(estado.invertido?estado.origem:estado.destino).split(',')[0];
  renderViagem(); abrirFull('f-viagem',true);
}
function renderViagem(){
  const v=viagem, r=rota(), total=v.ps.length;
  if(v.i>=total){
    $('viagem-corpo').innerHTML=`<div class="fim">
      <div class="big"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
      <h4>Viagem concluída</h4><p>Você fez ${v.feitas.length} de ${total} paradas no caminho.</p></div>
      <div class="card ganho"><span>Pontos ganhos</span><b>+${fmt(v.ganho)}</b></div>
      <button class="btn" onclick="concluir()">Ver meus pontos</button>`;
    return;
  }
  const p=v.ps[v.i], kmAnt=v.i?v.ps[v.i-1].km:0;
  $('viagem-corpo').innerHTML=`
    <div class="progresso"><i style="width:${(v.i/total)*100}%"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--cinza);margin-top:6px"><span>Parada ${v.i+1} de ${total}</span><span>${r.km} km no total</span></div>
    <div class="card prox" style="margin-top:14px">
      <div class="l">Próxima parada · em ${p.km-kmAnt} km</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px"><div class="ico" style="width:42px;height:42px">${icone(p.c,18)}</div>
      <div><h4 style="margin:0">${p.n}</h4><div class="meta">${ROTULO[p.c]} · ${p.d}</div></div></div>
    </div>
    <div class="card ganho"><span>Pontos nesta viagem</span><b>+${fmt(v.ganho)}</b></div>
    <button class="btn" onclick="checkin(true)">Cheguei · fazer check-in (+${p.p})</button>
    <button class="btn sec" style="margin-top:8px" onclick="checkin(false)">Pular esta parada</button>`;
}
function checkin(ok){
  const p=viagem.ps[viagem.i];
  if(ok){ viagem.ganho+=p.p; viagem.feitas.push(p); toast(`Check-in feito · +${p.p} pontos`); }
  viagem.i++; renderViagem();
}
function concluir(){
  if(viagem.ganho){ estado.saldo+=viagem.ganho; estado.historico.unshift({n:($('txt-origem').textContent.split(',')[0])+' → '+($('txt-destino').textContent.split(',')[0]),d:'hoje',p:viagem.ganho}); }
  abrirFull('f-viagem',false); trocarView('v-perfil');
}
function fecharViagem(){ abrirFull('f-viagem',false); }

/* perfil */
function renderPerfil(){
  $('txt-saldo').textContent=fmt(estado.saldo);
  const meta=3000; $('barra-nivel').style.width=Math.min(100,estado.saldo/meta*100)+'%';
  $('txt-falta').textContent = estado.saldo>=meta ? 'Nível Aventureiro desbloqueado!' : `Faltam ${fmt(meta-estado.saldo)} pontos para o nível Aventureiro`;
  $('historico').innerHTML=estado.historico.map(h=>`<div class="linha"><span>${h.n} · ${h.d}</span><b>+${fmt(h.p)}</b></div>`).join('');
}

let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

render();
</script>
</body>
</html>
